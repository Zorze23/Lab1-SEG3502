<div class="calculator-card">

  <div class="calculator-header">
    <h1>Calculatrice</h1>
    <p>Vous pouvez entrer deux nombres et sélectionner une opération. Suite à la soumission,
      l'application vous donnera le résultat de l'opération.</p>
  </div>

  <div class="input-group">
    <label for="first">Premier nombre:</label>
    <input
      id="first"
      type="number"
      #first
      (input)="resetResult()"
    >
  </div>

  <div class="input-group">
    <label for="second">Second nombre:</label>
    <input
      id="second"
      type="number"
      #second
      (input)="resetResult()"
    >
  </div>

  <div class="operation-section">
    <span class="section-label">Opération:</span>

    <div class="operations">
      <button
        type="button"
        class="operation-button"
        [class.selected]="selectedOperation === '+'"
        (click)="selectOperation('+')">
        +
      </button>

      <button
        type="button"
        class="operation-button"
        [class.selected]="selectedOperation === '-'"
        (click)="selectOperation('-')">
        −
      </button>

      <button
        type="button"
        class="operation-button"
        [class.selected]="selectedOperation === '*'"
        (click)="selectOperation('*')">
        ×
      </button>

      <button
        type="button"
        class="operation-button"
        [class.selected]="selectedOperation === '/'"
        (click)="selectOperation('/')">
        ÷
      </button>
    </div>
  </div>

  <button
    class="submit-button"
    [disabled]="selectedOperation === ''"
    (click)="calculate(first.value, second.value)">
    Calculer
  </button>

  <div class="result-section">
    <span class="section-label">Résultat:</span>

    <output class="result-value">
      @if (errorMessage) {
        {{ errorMessage }}
      } @else if (result === null) {
        --
      } @else {
        {{ result | number: '1.0-2' }}
      }
    </output>
  </div>

</div>
